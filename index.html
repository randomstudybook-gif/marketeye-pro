<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketEye Pro</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0f19" />
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --border: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --accent: #3b82f6;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; max-width: 1150px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    h1 { font-size: 1.3rem; color: #38bdf8; }
    .sub-head { font-size: 0.75rem; color: var(--muted); }
    .btn { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .btn:disabled { opacity: 0.6; }

    /* Two Distinct Main Sections Switcher */
    .mode-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; background: #0f172a; padding: 6px; border-radius: 12px; border: 1px solid var(--border); }
    .mode-btn { padding: 11px; border-radius: 9px; border: none; background: transparent; color: var(--muted); font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .mode-btn.active-swing { background: #10b981; color: #052e16; }
    .mode-btn.active-fno { background: #3b82f6; color: #ffffff; }

    .section-banner { background: #0f172a; border-left: 4px solid #10b981; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 0.82rem; color: #cbd5e1; line-height: 1.5; }
    .section-banner.fno-theme { border-left-color: #3b82f6; }

    .indices { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .idx-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .idx-title { font-size: 0.82rem; color: var(--muted); display: flex; justify-content: space-between; font-weight: 600; }
    .idx-val { font-size: 1.25rem; font-weight: 700; margin: 4px 0 8px; }
    .oc-strip { background: #0f172a; border-radius: 7px; padding: 8px; font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; border: 1px solid #1e293b; }
    .oc-tag { color: #cbd5e1; }
    .oc-tag strong { color: #38bdf8; }

    .search-box { position: relative; margin-bottom: 14px; }
    .search-box input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 0.95rem; outline: none; }
    .suggestions { position: absolute; width: 100%; background: #1e293b; border-radius: 8px; margin-top: 4px; z-index: 30; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .sug-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    .sug-item:hover { background: #334155; }

    .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 7px 13px; border-radius: 20px; cursor: pointer; font-size: 0.84rem; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .status { text-align: center; color: #38bdf8; padding: 8px; font-size: 0.88rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(315px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; transition: 0.15s; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .sym-row { display: flex; align-items: center; gap: 8px; }
    .sym { font-size: 1.1rem; font-weight: 700; }
    .star-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b; line-height: 1; }
    .star-btn.saved { color: var(--gold); }
    .cname { font-size: 0.78rem; color: var(--muted); }
