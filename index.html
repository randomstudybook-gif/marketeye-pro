<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketEye Pro</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0f19" />
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --border: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --accent: #3b82f6;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; max-width: 1150px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .title-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1 { font-size: 1.3rem; color: #38bdf8; }
    .mkt-badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 12px; }
    .mkt-open { background: rgba(16,185,129,0.18); color: #10b981; border: 1px solid rgba(16,185,129,0.4); }
    .mkt-closed { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .sub-head { font-size: 0.74rem; color: var(--muted); margin-top: 3px; }
    .controls { display: flex; gap: 8px; align-items: center; }
    select, .btn { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 7px 11px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.84rem; }
    .btn-primary { background: var(--accent); border-color: var(--accent); }
    .btn:disabled { opacity: 0.6; }

    /* Two Distinct Main Sections */
    .mode-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; background: #0f172a; padding: 6px; border-radius: 12px; border: 1px solid var(--border); }
    .mode-btn { padding: 11px; border-radius: 9px; border: none; background: transparent; color: var(--muted); font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .mode-btn.active-swing { background: #10b981; color: #052e16; }
    .mode-btn.active-fno { background: #3b82f6; color: #ffffff; }

    .section-banner { background: #0f172a; border-left: 4px solid #10b981; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 0.82rem; color: #cbd5e1; line-height: 1.5; }
    .section-banner.fno-theme { border-left-color: #3b82f6; }

    .indices { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .idx-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .idx-title { font-size: 0.82rem; color: var(--muted); display: flex; justify-content: space-between; font-weight: 600; }
    .idx-val { font-size: 1.25rem; font-weight: 700; margin: 4px 0 8px; }
    .oc-strip { background: #0f172a; border-radius: 7px; padding: 8px; font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; border: 1px solid #1e293b; }
    .oc-tag { color: #cbd5e1; }
    .oc-tag strong { color: #38bdf8; }
    .src-badge { font-size: 0.68rem; background: #1e293b; color: #94a3b8; padding: 2px 6px; border-radius: 4px; }

    .search-box { position: relative; margin-bottom: 14px; }
    .search-box input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 0.95rem; outline: none; }
    .suggestions { position: absolute; width: 100%; background: #1e293b; border-radius: 8px; margin-top: 4px; z-index: 30; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .sug-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    .sug-item:hover { background: #334155; }

    .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 7px 13px; border-radius: 20px; cursor: pointer; font-size: 0.84rem; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .status { text-align: center; color: #38bdf8; padding: 10px; font-size: 0.88rem; background: rgba(56,189,248,0.06); border-radius: 8px; margin-bottom: 12px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(315px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; transition: 0.15s; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .sym-row { display: flex; align-items: center; gap: 8px; }
    .sym { font-size: 1.1rem; font-weight: 700; }
    .star-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b; line-height: 1; }
    .star-btn.saved { color: var(--gold); }
    .cname { font-size: 0.78rem; color: var(--muted); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .buy { background: rgba(16,185,129,0.18); color: var(--green); }
    .sell { background: rgba(239,68,68,0.18); color: var(--red); }
    .price-row { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0; }
    .price { font-size: 1.3rem; font-weight: 700; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }

    .strength-box { background: #1e293b; padding: 7px 9px; border-radius: 7px; margin-bottom: 8px; }
    .strength-top { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 700; color: var(--gold); }
    .strength-sub { font-size: 0.72rem; color: #cbd5e1; margin-top: 3px; line-height: 1.4; }

    .ai-note { font-size: 0.78rem; color: #e2e8f0; background: rgba(56,189,248,0.08); border-left: 3px solid #38bdf8; padding: 7px 9px; border-radius: 4px; margin-bottom: 8px; line-height: 1.45; }
    .active-zone { background: #0f172a; border-radius: 8px; padding: 10px; font-size: 0.84rem; margin: 8px 0; line-height: 1.65; border-left: 3px solid var(--green); }
    .active-zone.sell-zone { border-left-color: var(--red); }

    .pillars { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-size: 0.75rem; }
    .pill { background: #1e293b; padding: 3px 7px; border-radius: 5px; color: #cbd5e1; }

    .card-foot { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
    .chart-btn { background: #2563eb; color: #fff; border: none; padding: 8px 12px; border-radius: 7px; font-size: 0.82rem; font-weight: 600; cursor: pointer; width: 100%; }

    footer { margin-top: 24px; padding: 12px; border-top: 1px solid var(--border); font-size: 0.76rem; color: var(--muted); text-align: center; line-height: 1.5; background: #0f172a; border-radius: 8px; }

    /* Modal */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50; justify-content: center; align-items: center; padding: 12px; }
    .modal-bg.open { display: flex; }
    .modal { background: #111827; border: 1px solid #334155; border-radius: 14px; max-width: 680px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 16px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 10px; }
    .close-btn { background: #1e293b; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.75rem; color: #cbd5e1; margin: 6px 0; }
    canvas { width: 100%; height: 240px; background: #0b0f19; border-radius: 8px; border: 1px solid #1e293b; }
    .calc-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 0.85rem; }
    .calc-box input { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 5px 8px; border-radius: 6px; width: 110px; margin-left: 6px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title-wrap">
        <h1>MarketEye Pro</h1>
        <span id="mktStatusBadge" class="mkt-badge mkt-closed">Checking Market...</span>
      </div>
      <div id="lastUpdated" class="sub-head">Auto-Refresh: 5m (Swing) | 60s (F&O)</div>
    </div>
    <div class="controls">
      <select id="langSelect" onchange="changeLang(this.value)" title="Select Language">
        <option value="mr">मराठी</option>
        <option value="hi">हिंदी</option>
        <option value="en">English</option>
      </select>
      <button id="refreshBtn" class="btn btn-primary" onclick="loadDashboard()">Refresh</button>
    </div>
  </header>

  <!-- TWO DISTINCT MAIN SECTIONS -->
  <div class="mode-bar">
    <button id="btnSwing" class="mode-btn active-swing" onclick="switchMode('SWING')">📈 स्विंग ट्रेडिंग (Equity)</button>
    <button id="btnFno" class="mode-btn" onclick="switchMode('FNO')">⚡ F&O टर्मिनल (Options)</button>
  </div>

  <div id="sectionBanner" class="section-banner"></div>

  <!-- F&O INDICES & OPTION CHAIN -->
  <div id="indicesSection" class="indices" style="display:none;">
    <div class="idx-card">
      <div class="idx-title"><span>NIFTY 50 (Option Chain)</span><span id="niftySent" style="color:#38bdf8"></span></div>
      <div id="niftyVal" class="idx-val">Loading...</div>
      <div id="niftyOC" class="oc-strip">Loading Option Chain...</div>
    </div>
    <div class="idx-card">
      <div class="idx-title"><span>BANK NIFTY (Option Chain)</span><span id="bnSent" style="color:#38bdf8"></span></div>
      <div id="bnVal" class="idx-val">Loading...</div>
      <div id="bnOC" class="oc-strip">Loading Option Chain...</div>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search NSE stock for Candlestick Chart & Option Chain (e.g. RELIANCE, HAL, ZOMATO)..." oninput="onSearchInput(this.value)" />
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div class="filters">
    <button class="tab active" onclick="setFilter('ALL', this)" id="tabAll">All Stocks</button>
    <button class="tab" onclick="setFilter('WATCHLIST', this)">★ Watchlist (<span id="wlCount">0</span>)</button>
    <button class="tab" onclick="setFilter('BUY', this)" id="tabBuy">Buy Zone</button>
    <button class="tab" onclick="setFilter('SELL', this)" id="tabSell">Sell Zone</button>
  </div>

  <div id="statusMsg" class="status">⏳ NSE सर्व्हरवरून ताजा डेटा आणत आहोत, कृपया १५–३० सेकंद प्रतीक्षा करा...</div>
  <div id="cardsGrid" class="grid"></div>

  <footer
